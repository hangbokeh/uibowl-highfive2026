<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UIBOWL X HIGHFIVE 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #151515;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
    }

    .wrap {
      max-width: 430px;
      margin: 0 auto;
      padding: 100px 20px 60px;
    }

    /* ───────────────────────────────
       헤더
    _______________ */
    .header {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 32px;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: #477BFF;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
    }

    .header-desc {
      font-size: 14px;
      color: #aaaaaa;
      line-height: 1.7;
    }

    .header-desc strong {
      color: #ffffff;
      font-weight: 700;
    }

    /* ───────────────────────────────
       미션 카드
    _______________ */
    .card {
      background: #1E1E22;
      border-radius: 20px;
      padding: 24px 20px;
      margin-bottom: 20px;
    }

    .mission-label {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 14px;
    }

    .num-badge {
      width: 22px;
      height: 22px;
      background: #477BFF;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: #ffffff;
      flex-shrink: 0;
    }

    .mission-tag {
      font-size: 11px;
      font-weight: 700;
      color: #477BFF;
      letter-spacing: 1.5px;
    }

    .card h2 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.35;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 13px;
      color: #888888;
      line-height: 1.75;
      margin-bottom: 18px;
    }

    .card p b {
      color: #dddddd;
      font-weight: 600;
    }


    .btn {
      display: block;
      border: 1.5px solid #477BFF;
      color: #ffffff;
      background: #477BFF;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      padding: 14px;
      transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      background: #3567E6;
      border-color: #3567E6;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .footer {
      margin-top: 28px;
      padding: 8px 0 4px;
      text-align: center;
    }

    .footer-line {
      width: 64px;
      height: 1px;
      margin: 0 auto 24px;
      background: #2D2D2D;
    }

    .footer-text {
      font-size: 13px;
      color: #5E5E5E;
      line-height: 1.6;
      margin-bottom: 26px;
    }

    .footer-brand {
      font-size: 36px;
      font-weight: 700;
      color: #696969;
      letter-spacing: 0.2px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- ============================
         ✏️ 헤더 수정 구간
    ============================= -->
    <div class="header">
      <div class="logo-row">
        <div class="logo-row">
          <img 
            src="https://denim-lemon-450.notion.site/image/attachment%3Acdb0f94c-7953-4da8-9104-fcf9d496d556%3A_%E1%84%8B%E1%85%B5%E1%84%8B%E1%85%A5_1.svg?table=block&id=351ff3f1-168c-804a-9aca-c3be288df741&spaceId=2c2908dc-9af0-438f-b270-a2eb0f10e14e&userId=&cache=v2" 
            height="36"
            alt="UIBOWL"
          />
        </div>
      </div>
      <div class="header-desc">
        UXUI 큐레이션 서비스,<br>
        유아이볼 부스에 방문해주셔서 감사합니다.<br>
      </div>
    </div>

    <!-- ============================
         ✏️ 미션 01 카드
    ============================= -->
    <div class="card">
      <div class="mission-label">
        <div class="num-badge">1</div>
        <span class="mission-tag"></span> <!-- ✏️ 미션 레이블 -->
      </div>
      <h2>유아이볼 가입하고<br>굿즈 받아가세요 </h2> <!-- ✏️ 미션 제목 -->
      <p>회원가입만 해도 <b>굿즈 100% 증정!</b> <br>모자, 티셔츠, 타포린백 등 총 9종의 굿즈가 준비돼 있어요!</p> <!-- ✏️ 미션 설명 -->
      <a class="btn" href="https://uibowl.io/landing?lang=ko" target="_blank"> <!-- ✏️ 링크 -->
        유아이볼 바로가기 <!-- ✏️ 버튼 텍스트 -->
      </a>
    </div>

    <!-- ============================
         ✏️ 미션 02 카드
    ============================= -->
    <div class="card">
      <div class="mission-label">
        <div class="num-badge">2</div>
        <span class="mission-tag"></span> <!-- ✏️ 미션 레이블 -->
      </div>
      <h2>에어팟4 당첨까지<br>노려보세요 🎧</h2> <!-- ✏️ 미션 제목 -->
      <p>
        유아이볼 링크드인 <b>팔로우</b> + 이벤트 게시물에 <b>좋아요</b>를<br>
        남기면, 에어팟 이벤트에 자동 응모돼요!<br>
       <!-- ✏️ 미션 설명 -->
      </p>
      <a class="btn" href="https://www.linkedin.com/posts/uibowl2024_ssqsjistwruu-ukqstwtzastwrzg2026-sqotyyrgu-activity-7459393607779635201-I3zO?utm_source=share&utm_medium=member_desktop&rcm=ACoAAGW-xIIB7ybDs9-HrYCQ2Au_JFaHKhbyWj8" target="_blank"> <!-- ✏️ 링크 -->
        링크드인 바로가기 <!-- ✏️ 버튼 텍스트 -->
      </a>
    </div>

    <div class="footer">
      <div class="footer-line"></div>
      <p class="footer-text">부스 담당자에게 인증해주시면, 각종 굿즈를 제공해드립니다.</p>
      <div class="footer-line"></div>
      <p class="footer-brand">uibowl.io</p>
    </div>

  </div>
</body>
</html>
